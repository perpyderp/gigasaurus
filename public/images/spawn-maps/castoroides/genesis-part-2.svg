<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" class="creatureMap" style="position:absolute;">
<defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" />
    </filter>
    <style>
        .spawningMap-very-common { fill: #0F0; }
        .spawningMap-common { fill: #B2FF00; }
        .spawningMap-uncommon { fill: #FF0; }
        .spawningMap-very-uncommon { fill: #FC0; }
        .spawningMap-rare { fill: #F60; }
        .spawningMap-very-rare { fill: #F00; }
        .spawning-map-point { stroke:black; stroke-width:1; }
    </style>
</defs>
<g filter="url(#blur)" opacity="0.7">
    <g class="spawningMap-very-common">
        <rect x="211" y="117" width="12" height="13" />
        <rect x="218" y="121" width="11" height="12" />
        <rect x="226" y="58" width="12" height="11" />
    </g>
    <g class="spawningMap-common">
        <rect x="231" y="158" width="18" height="21" />
        <rect x="216" y="182" width="16" height="14" />
        <rect x="207" y="159" width="17" height="24" />
        <rect x="192" y="118" width="17" height="13" />
    </g></g>
</svg>