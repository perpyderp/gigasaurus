<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" class="creatureMap" style="position:absolute;">
<defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" />
    </filter>
    <style>
        .spawningMap-very-common { fill: #0F0; }
        .spawningMap-common { fill: #B2FF00; }
        .spawningMap-uncommon { fill: #FF0; }
        .spawningMap-very-uncommon { fill: #FC0; }
        .spawningMap-rare { fill: #F60; }
        .spawningMap-very-rare { fill: #F00; }
        .spawning-map-point { stroke:black; stroke-width:1; }
    </style>
    <pattern id="pattern-untameable" width="10" height="10" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">
        <rect width="4" height="10" fill="black"></rect>
    </pattern>
    <filter id="groupStroke">
        <feFlood result="outsideColor" flood-color="black"/>
        <feMorphology in="SourceAlpha" operator="dilate" radius="2"/>
        <feComposite result="strokeoutline1" in="outsideColor" operator="in"/>
        <feComposite result="strokeoutline2" in="strokeoutline1" in2="SourceAlpha" operator="out"/>
        <feGaussianBlur in="strokeoutline2" result="strokeblur" stdDeviation="1"/>
    </filter>
</defs>
<g filter="url(#blur)" opacity="0.7">
    <g class="spawningMap-uncommon">
        <rect x="261" y="103" width="13" height="13" />
        <rect x="90" y="197" width="15" height="15" />
        <rect x="90" y="198" width="15" height="14" />
        <rect x="24" y="130" width="17" height="18" />
        <rect x="24" y="118" width="17" height="17" />
        <rect x="12" y="130" width="17" height="18" />
    </g>
    <g class="spawningMap-very-common">
        <rect x="240" y="47" width="7" height="7" />
        <rect x="96" y="17" width="10" height="10" />
        <rect x="111" y="21" width="7" height="7" />
    </g>
    <g class="spawningMap-very-uncommon">
        <rect x="202" y="134" width="13" height="13" />
        <rect x="160" y="22" width="15" height="15" />
        <rect x="215" y="170" width="27" height="28" />
        <rect x="174" y="35" width="15" height="15" />
        <rect x="90" y="274" width="17" height="18" />
        <rect x="123" y="230" width="17" height="18" />
        <rect x="57" y="209" width="17" height="17" />
        <rect x="35" y="187" width="17" height="17" />
        <rect x="68" y="187" width="17" height="17" />
        <rect x="12" y="118" width="17" height="17" />
        <rect x="190" y="105" width="17" height="18" />
        <rect x="145" y="98" width="17" height="18" />
        <rect x="201" y="132" width="17" height="18" />
        <rect x="197" y="146" width="17" height="17" />
        <rect x="212" y="137" width="17" height="17" />
        <rect x="227" y="136" width="17" height="17" />
        <rect x="227" y="155" width="17" height="17" />
    </g>
    <g class="spawningMap-rare">
        <rect x="110" y="89" width="28" height="32" />
        <rect x="79" y="274" width="17" height="18" />
        <rect x="90" y="263" width="17" height="18" />
        <rect x="90" y="220" width="17" height="17" />
    </g></g>
<g fill="url(#pattern-untameable)" opacity="0.3">
        <rect x="240" y="47" width="7" height="7" />
        <rect x="96" y="17" width="10" height="10" />
        <rect x="111" y="21" width="7" height="7" />
</g>
<g filter="url(#groupStroke)" opacity="0.8">
        <rect x="90" y="198" width="15" height="14" />
        <rect x="240" y="47" width="7" height="7" />
        <rect x="96" y="17" width="10" height="10" />
        <rect x="111" y="21" width="7" height="7" />
</g>
</svg>